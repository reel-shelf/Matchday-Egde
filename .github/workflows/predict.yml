name: Update predictions
on:
  schedule:
    - cron: "17 11,23 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: predictions
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make predictions
        run: python3 predict.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALLTOKEN }}
      - name: International games
        run: python3 intl.py || echo "intl.py failed; club predictions are still saved"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Save to the repo
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update predictions"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done
          exit 1
