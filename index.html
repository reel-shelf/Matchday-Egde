<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday Edge</title>
<meta name="description" content="Football predictions for the Premier League, La Liga and Serie A">
<style>
  :root {
    --bg: #0b0f0d; --card: #141a17; --card2: #1b231f; --line: #26302b;
    --text: #eef3f0; --muted: #8fa198; --accent: #2fd27a; --accent2: #f5c542;
    --home: #2fd27a; --draw: #8a958f; --away: #4aa8ff; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 16px 8px; max-width: 720px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .updated { color: var(--muted); font-size: 12px; margin-top: 2px; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 10px; background: var(--card);
    padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted);
    padding: 9px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #062512; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--card);
    color: var(--text); padding: 6px 12px; border-radius: 999px; font: inherit;
    font-size: 13px; cursor: pointer; }
  .chips button.on { border-color: var(--accent); color: var(--accent); }
  .day { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; margin: 18px 2px 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; cursor: pointer; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; margin: 10px 0 8px; }
  .team { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .team.r { flex-direction: row-reverse; text-align: right; }
  .team img { width: 26px; height: 26px; object-fit: contain; flex: none; }
  .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xg { font-size: 12px; color: var(--muted); text-align: center; white-space: nowrap; }
  .xg b { display: block; color: var(--text); font-size: 17px; }
  .bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .bar i { display: block; }
  .probs { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; }
  .probs .h { color: var(--home); } .probs .d { color: var(--draw); } .probs .a { color: var(--away); }
  .pick { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .badge { background: var(--card2); border-radius: 8px; padding: 4px 9px; font-size: 13px; font-weight: 600; }
  .conf { font-size: 12px; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
  .conf.High { background: rgba(47,210,122,.15); color: var(--accent); }
  .conf.Medium { background: rgba(245,197,66,.15); color: var(--accent2); }
  .conf.Low { background: rgba(143,161,152,.15); color: var(--muted); }
  .more { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .card.open .more { display: block; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--card2); border-radius: 10px; padding: 9px 10px; }
  .stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .stat b { font-size: 16px; }
  .half { margin-top: 12px; }
  .half h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 8px; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 4px; }
  .summary .stat b { font-size: 20px; }
  .res { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: default; }
  .res .t { font-weight: 600; min-width: 0; }
  .res .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .sc { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .marks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .mark { font-size: 11px; padding: 2px 6px; border-radius: 6px; }
  .mark.ok { background: rgba(47,210,122,.15); color: var(--accent); }
  .mark.no { background: rgba(255,93,93,.12); color: var(--bad); }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  footer { color: var(--muted); font-size: 11px; text-align: center; padding: 10px 16px 30px; max-width: 720px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>Matchday <span>Edge</span></h1>
  <div class="updated" id="updated">Loading…</div>
</header>
<main>
  <div class="tabs">
    <button id="tab-up" class="on">Predictions</button>
    <button id="tab-res">Track record</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>
<footer>Predictions come from a statistical model and are for entertainment only. Not betting advice.</footer>

<script>
const LEAGUES = { PL: "Premier League", PD: "La Liga", SA: "Serie A" };
let data = { matches: [], leagues: {} }, history = { matches: {} };
let tab = "up", league = "ALL";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const crest = url => url ? `<img src="${esc(url)}" alt="" loading="lazy">` : "";
const pickText = (p, home, away) => p === "1" ? `${home} win` : p === "2" ? `${away} win` : "Draw";

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - today) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  return h < 48 ? `${h} hours ago` : `${Math.round(h / 24)} days ago`;
}

function renderChips() {
  const list = [["ALL", "All leagues"], ...Object.entries(LEAGUES)];
  document.getElementById("chips").innerHTML = list.map(([k, v]) =>
    `<button data-l="${k}" class="${k === league ? "on" : ""}">${v}</button>`).join("");
}

function bar(h, d, a) {
  return `<div class="bar"><i style="width:${h}%;background:var(--home)"></i>` +
    `<i style="width:${d}%;background:var(--draw)"></i>` +
    `<i style="width:${a}%;background:var(--away)"></i></div>`;
}

function halfBlock(title, h, home, away) {
  return `<div class="half"><h4>${title} · likely ${h.score[0]}-${h.score[1]}</h4>
    ${bar(h.home, h.draw, h.away)}
    <div class="probs"><span class="h">${esc(home)} ${h.home}%</span><span class="d">Draw ${h.draw}%</span><span class="a">${esc(away)} ${h.away}%</span></div>
    <div class="grid" style="margin-top:8px">
      <div class="stat"><small>Over 0.5 goals</small><b>${h.over05}%</b></div>
      <div class="stat"><small>Over 1.5 goals</small><b>${h.over15}%</b></div>
    </div></div>`;
}

function renderUpcoming() {
  const list = data.matches.filter(m => league === "ALL" || m.league === league);
  if (!list.length) return `<div class="empty">No upcoming matches in the next 10 days yet. Check back after the next update.</div>`;
  let html = "", lastDay = "";
  for (const m of list) {
    const d = new Date(m.date), day = dayLabel(d);
    if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    const f = m.ft, H = m.home.name, A = m.away.name;
    const bh = m.busierHalf;
    const busier = bh.second >= bh.first && bh.second >= bh.equal ? `2nd half (${bh.second}%)`
      : bh.first >= bh.equal ? `1st half (${bh.first}%)` : `Equal (${bh.equal}%)`;
    html += `<div class="card" data-id="${m.id}">
      <div class="meta"><span>${esc(LEAGUES[m.league] || m.league)}${m.matchday ? " · MD " + m.matchday : ""}</span>
        <span>${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span></div>
      <div class="teams">
        <div class="team">${crest(m.home.crest)}<span>${esc(H)}</span></div>
        <div class="xg"><b>${f.xg[0].toFixed(1)} – ${f.xg[1].toFixed(1)}</b>exp. goals</div>
        <div class="team r">${crest(m.away.crest)}<span>${esc(A)}</span></div>
      </div>
      ${bar(f.home, f.draw, f.away)}
      <div class="probs"><span class="h">Home ${f.home}%</span><span class="d">Draw ${f.draw}%</span><span class="a">Away ${f.away}%</span></div>
      <div class="pick"><span class="badge">Pick: ${esc(pickText(f.pick, H, A))}</span>
        <span class="conf ${f.confidence}">${f.confidence}</span></div>
      <div class="more">
        <div class="grid">
          <div class="stat"><small>Likely score</small><b>${f.score[0]}-${f.score[1]}</b></div>
          <div class="stat"><small>Both teams score</small><b>${f.btts}%</b></div>
          <div class="stat"><small>Over 1.5 goals</small><b>${f.over15}%</b></div>
          <div class="stat"><small>Over 2.5 goals</small><b>${f.over25}%</b></div>
          <div class="stat"><small>Over 3.5 goals</small><b>${f.over35}%</b></div>
          <div class="stat"><small>More goals in</small><b>${busier}</b></div>
        </div>
        ${halfBlock("First half", m.h1, H, A)}
        ${halfBlock("Second half", m.h2, H, A)}
      </div>
      <div class="hint">Tap for goals & halves</div>
    </div>`;
  }
  return html;
}

function grade(r) {
  const [hg, ag] = r.result.ft;
  const actual = hg > ag ? "1" : hg < ag ? "2" : "X";
  const out = {
    winner: r.pick === actual,
    over25: (r.over25 > 50) === (hg + ag > 2.5),
    btts: (r.btts > 50) === (hg > 0 && ag > 0),
    exact: r.score[0] === hg && r.score[1] === ag,
  };
  const ht = r.result.ht;
  if (ht && ht[0] != null) {
    const a1 = ht[0] > ht[1] ? "1" : ht[0] < ht[1] ? "2" : "X";
    out.h1 = r.h1pick === a1;
  }
  return out;
}

function renderResults() {
  const list = Object.values(history.matches)
    .filter(r => r.result && (league === "ALL" || r.league === league))
    .sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) return `<div class="empty">No graded games yet. Every prediction is locked in before kick-off, then checked against the real score here once the match is played.</div>`;
  const g = list.map(r => ({ r, g: grade(r) }));
  const rate = k => {
    const xs = g.filter(x => x.g[k] !== undefined);
    const n = xs.filter(x => x.g[k]).length;
    return xs.length ? `${Math.round(100 * n / xs.length)}% <small style="display:inline;text-transform:none">(${n}/${xs.length})</small>` : "–";
  };
  const hi = g.filter(x => x.r.confidence === "High");
  const hiRate = hi.length ? `${Math.round(100 * hi.filter(x => x.g.winner).length / hi.length)}% <small style="display:inline;text-transform:none">(${hi.filter(x => x.g.winner).length}/${hi.length})</small>` : "–";
  let html = `<div class="summary">
    <div class="stat"><small>Winner pick</small><b>${rate("winner")}</b></div>
    <div class="stat"><small>High confidence</small><b>${hiRate}</b></div>
    <div class="stat"><small>Over/Under 2.5</small><b>${rate("over25")}</b></div>
    <div class="stat"><small>Both teams score</small><b>${rate("btts")}</b></div>
    <div class="stat"><small>1st half result</small><b>${rate("h1")}</b></div>
    <div class="stat"><small>Exact score</small><b>${rate("exact")}</b></div>
  </div><div class="day">Recent games</div>`;
  const m = (ok, label) => ok === undefined ? "" : `<span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"} ${label}</span>`;
  for (const { r, g: x } of g.slice(0, 60)) {
    html += `<div class="card res"><div class="t">
        <div>${esc(r.home)} v ${esc(r.away)}</div>
        <div class="meta"><span>${esc(LEAGUES[r.league])} · picked ${esc(pickText(r.pick, r.home, r.away))}, ${r.score[0]}-${r.score[1]}</span></div>
        <div class="marks">${m(x.winner, "Winner")}${m(x.over25, "O/U 2.5")}${m(x.btts, "BTTS")}${m(x.h1, "1st half")}${x.exact ? m(true, "Exact score") : ""}</div>
      </div><div class="sc">${r.result.ft[0]}-${r.result.ft[1]}</div></div>`;
  }
  return html;
}

function render() {
  renderChips();
  document.getElementById("view").innerHTML = tab === "up" ? renderUpcoming() : renderResults();
  document.getElementById("tab-up").className = tab === "up" ? "on" : "";
  document.getElementById("tab-res").className = tab === "res" ? "on" : "";
}

document.getElementById("tab-up").onclick = () => { tab = "up"; render(); };
document.getElementById("tab-res").onclick = () => { tab = "res"; render(); };
document.getElementById("chips").onclick = e => {
  const b = e.target.closest("button"); if (b) { league = b.dataset.l; render(); }
};
document.getElementById("view").onclick = e => {
  const c = e.target.closest(".card[data-id]"); if (c) c.classList.toggle("open");
};

async function load() {
  const bust = "?t=" + Date.now();
  try {
    const [p, h] = await Promise.all([
      fetch("data/predictions.json" + bust).then(r => r.ok ? r.json() : null),
      fetch("data/history.json" + bust).then(r => r.ok ? r.json() : null),
    ]);
    if (p) data = p;
    if (h) history = h;
    document.getElementById("updated").textContent = p
      ? `Updated ${ago(p.updated)}` : "No predictions yet. Run the update first.";
  } catch (e) {
    document.getElementById("updated").textContent = "Couldn't load predictions.";
  }
  render();
}
load();
</script>
</body>
</html>
