# Matchday Edge on Netlify.
# Each build runs predict.py (fresh predictions) and publishes the app from dist/.
# netlify/functions/rebuild.mts starts a build twice a day (replaces the old GitHub Action).
# netlify/functions/team-news.mts checks injuries and lineups every 5 minutes.
[build]
  command = "sh netlify/build.sh"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
