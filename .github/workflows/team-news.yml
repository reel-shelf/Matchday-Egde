name: Live updates
# Every 5 minutes: team news and bookmaker odds (team_news.py), live scores (live.py),
# parlay and team-news track record (tracker.py) and phone alerts (alerts.py).
# Results go to the live-data branch (data/ folder), which the app reads directly,
# so main isn't flooded with commits.
# GitHub often starts scheduled runs late, so each run stays on for up to 5h40m and
# loops itself; the hourly schedule restarts it. Only one run is active at a time.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: team-news
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Live updates every 5 minutes
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALLTOKEN }}
          LIVE_DIR: live/data
          API_FOOTBALL_DAILY_LIMIT: "60"   # the other ~40 calls a day are for intl.py
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          if git fetch -q origin live-data:refs/remotes/origin/live-data; then
            git worktree add -q -B live-data live origin/live-data
          else
            git worktree add -q --orphan -b live-data live
          fi
          mkdir -p live/data
          end=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            git pull --rebase -q origin main || true      # new predictions and results
            python3 team_news.py || echo "team_news.py failed"
            python3 live.py || echo "live.py failed"
            python3 tracker.py || echo "tracker.py failed"
            python3 alerts.py || echo "alerts.py failed"
            (
              cd live && git add -A data
              if ! git diff --cached --quiet; then
                # one commit, replaced each time, so the branch stays small
                if git rev-parse -q --verify HEAD >/dev/null; then git commit -q --amend -m "Live data"
                else git commit -q -m "Live data"; fi
                git push -q -f origin live-data || echo "push failed"
              fi
            )
            wait=$(( 300 - ($(date +%s) - started) ))
            [ "$wait" -gt 0 ] && sleep "$wait"
          done
