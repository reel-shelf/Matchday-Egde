name: Site check (one-off)
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://reel-shelf.github.io/Matchday-Egde/ https://reel-shelf.github.io/Matchday-Egde/manifest.json https://reel-shelf.github.io/Matchday-Egde/data/predictions.json; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -L "$u")"
          done
          curl -s https://reel-shelf.github.io/Matchday-Egde/ | grep -o '<title>[^<]*</title>\|shareApp' | sort -u
