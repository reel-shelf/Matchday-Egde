<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday Edge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f0d">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchday Edge">
<meta name="description" content="Football predictions for Europe's top leagues and the Champions League">
<style>
  :root {
    --bg: #0b0f0d; --card: #141a17; --card2: #1b231f; --line: #26302b;
    --text: #eef3f0; --muted: #8fa198; --accent: #2fd27a; --accent2: #f5c542;
    --home: #2fd27a; --draw: #8a958f; --away: #4aa8ff; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: calc(18px + env(safe-area-inset-top)) 16px 8px; max-width: 720px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #install { display: none; border: 0; background: var(--accent); color: #062512; font: inherit; font-weight: 700;
    font-size: 13px; padding: 8px 14px; border-radius: 999px; cursor: pointer; flex: none; }
  #install.show { display: block; }
  .ios { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font-size: 13px; color: var(--muted); margin: 0 auto 6px; max-width: 688px; }
  .ios.show { display: block; }
  .ios b { color: var(--text); }
  h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .updated { color: var(--muted); font-size: 12px; margin-top: 2px; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
  .tabs { display: flex; gap: 4px; margin: 12px 0 10px; background: var(--card);
    padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted);
    padding: 9px 2px; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #062512; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--card);
    color: var(--text); padding: 6px 12px; border-radius: 999px; font: inherit;
    font-size: 13px; cursor: pointer; }
  .chips button.on { border-color: var(--accent); color: var(--accent); }
  .day { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; margin: 18px 2px 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; }
  .card[data-id] { cursor: pointer; }
  .card.flash { border-color: var(--accent); }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    gap: 8px; margin: 10px 0 8px; }
  .team { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .team.r { align-items: flex-end; text-align: right; }
  .team .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .team.r .nm { flex-direction: row-reverse; }
  .team img { width: 26px; height: 26px; object-fit: contain; flex: none; }
  .team .nm span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.2; }
  .form { display: flex; gap: 3px; }
  .form i { width: 15px; height: 15px; border-radius: 4px; font-size: 9px; font-style: normal;
    font-weight: 800; display: grid; place-items: center; color: #0b0f0d; }
  .form i.W { background: var(--home); } .form i.D { background: var(--draw); } .form i.L { background: var(--bad); }
  .xg { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; padding-top: 0; }
  .xg b { display: block; color: var(--text); font-size: 24px; line-height: 1.1; letter-spacing: 1px; }
  .xg small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
  .ctable { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ctable th { text-align: center; }
  .ctable td { padding: 7px 2px; }
  .ctable td:first-child { text-align: left; color: var(--muted); }
  .ctable td.hi { color: var(--accent); font-weight: 700; }
  .lg[data-l] { cursor: pointer; }
  .bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .probs { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; margin-top: 5px; }
  .probs .h { color: var(--home); } .probs .d { color: var(--draw); } .probs .a { color: var(--away); text-align: right; }
  .pick { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .badge { background: var(--card2); border-radius: 8px; padding: 4px 9px; font-size: 13px; font-weight: 600; }
  .badge em { font-style: normal; color: var(--muted); font-weight: 500; }
  .conf { font-size: 12px; padding: 3px 8px; border-radius: 999px; font-weight: 700; flex: none; }
  .conf.High { background: rgba(47,210,122,.15); color: var(--accent); }
  .conf.Medium { background: rgba(245,197,66,.15); color: var(--accent2); }
  .conf.Low { background: rgba(143,161,152,.15); color: var(--muted); }
  .more { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .card.open .more { display: block; }
  .card.open .hint { display: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .stat { background: var(--card2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
  .stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .stat b { font-size: 16px; }
  .sub { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .h2h { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0;
    border-bottom: 1px solid var(--line); }
  .h2h:last-child { border-bottom: 0; }
  .h2h span:first-child { color: var(--muted); flex: none; }
  .h2h span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h2h b { flex: none; }
  .hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 8px; }
  .best { background: linear-gradient(180deg, rgba(47,210,122,.10), rgba(47,210,122,.02));
    border: 1px solid rgba(47,210,122,.35); border-radius: 14px; padding: 12px; margin-top: 4px; }
  .best h3 { margin: 0 0 6px; font-size: 14px; color: var(--accent); }
  .bp { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .bp:last-child { border-bottom: 0; }
  .bp .t { min-width: 0; }
  .bp .t div:first-child { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bp .t div:last-child { color: var(--muted); font-size: 12px; }
  .bp b { color: var(--accent); flex: none; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 4px; }
  .summary .stat b { font-size: 20px; }
  .summary .stat b small { display: inline; text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 500; }
  .note { color: var(--muted); font-size: 12px; margin: 2px 2px 8px; }
  .res { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .res .t { font-weight: 600; min-width: 0; }
  .res .sc { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .marks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .mark { font-size: 11px; padding: 2px 6px; border-radius: 6px; }
  .mark.ok { background: rgba(47,210,122,.15); color: var(--accent); }
  .mark.no { background: rgba(255,93,93,.12); color: var(--bad); }
  .lg { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .lg:last-child { border-bottom: 0; }
  .lg span:last-child { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-align: center; padding: 6px 2px; }
  td { text-align: center; padding: 7px 2px; border-top: 1px solid var(--line); }
  td.tm, th.tm { text-align: left; }
  td.tm .row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  td.tm img { width: 18px; height: 18px; object-fit: contain; flex: none; }
  td.tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  td.tm .form { margin: 4px 0 0 25px; }
  td.tm .form i { width: 12px; height: 12px; font-size: 8px; border-radius: 3px; }
  td.pts { font-weight: 800; }
  .tbl { padding: 8px 10px; }
  .tbl h3 { margin: 4px 2px 6px; font-size: 15px; }
  .parlay h3 { margin: 0; font-size: 16px; }
  .parlay .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .parlay .chance { text-align: right; flex: none; }
  .parlay .chance b { display: block; font-size: 24px; color: var(--accent); line-height: 1.1; }
  .parlay .chance small { color: var(--muted); font-size: 11px; }
  .parlay.big .chance b { color: var(--accent2); }
  .leg { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0;
    border-top: 1px solid var(--line); cursor: pointer; }
  .leg .t { min-width: 0; }
  .leg .t div:first-child { font-weight: 700; font-size: 14px; }
  .leg .t div:last-child { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leg b { flex: none; font-size: 14px; }
  .odds { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted); }
  .odds b { color: var(--text); }
  .sizes { display: flex; gap: 6px; margin: 8px 0 4px; }
  .sizes button { flex: 1; border: 1px solid var(--line); background: var(--card2); color: var(--text);
    border-radius: 8px; padding: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .sizes button.on { border-color: var(--accent2); color: var(--accent2); }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  footer { color: var(--muted); font-size: 11px; text-align: center; padding: 10px 16px 30px; max-width: 720px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Matchday <span>Edge</span></h1>
    <div class="updated" id="updated">Loading…</div>
  </div>
  <button id="install">Install app</button>
</header>
<div class="ios" id="ios">To install on iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>
<main>
  <div class="tabs">
    <button data-tab="up" class="on">Predictions</button>
    <button data-tab="parlay">Parlay</button>
    <button data-tab="tables">Tables</button>
    <button data-tab="res">Track record</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>
<footer>Predictions come from a statistical model and are for entertainment only. Not betting advice.</footer>

<script>
const LEAGUES = { PL: "Premier League", PD: "La Liga", SA: "Serie A", BL1: "Bundesliga", FL1: "Ligue 1", CL: "Champions League" };
let data = { matches: [], leagues: {}, tables: {}, best: [] }, history = { matches: {} }, backtest = { rows: [] };
let tab = "up", league = "ALL", bigSize = 6;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const crest = url => url ? `<img src="${esc(url)}" alt="" loading="lazy">` : "";
const inLeague = code => league === "ALL" || code === league;
const formChips = f => f && f.length ? `<div class="form">${f.map(r => `<i class="${r}">${r}</i>`).join("")}</div>` : "";

function pickText(p, home, away) {
  return { "1": `${home} win`, "2": `${away} win`, "X": "Draw",
           "1X": `${home} or draw`, "X2": `${away} or draw`, "12": "Either team wins" }[p] || p;
}

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - today) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  return h < 48 ? `${h} hours ago` : `${Math.round(h / 24)} days ago`;
}

function renderChips() {
  const list = [["ALL", "All"], ...Object.entries(LEAGUES)];
  document.getElementById("chips").innerHTML = list.map(([k, v]) =>
    `<button data-l="${k}" class="${k === league ? "on" : ""}">${v}</button>`).join("");
}

function bar(h, d, a) {
  return `<div class="bar"><i style="width:${h}%;background:var(--home)"></i>` +
    `<i style="width:${d}%;background:var(--draw)"></i>` +
    `<i style="width:${a}%;background:var(--away)"></i></div>`;
}

function halfBlock(title, h, home, away) {
  return `<div class="sub">${title} · likely ${h.score[0]}-${h.score[1]}</div>
    ${bar(h.home, h.draw, h.away)}
    <div class="probs"><span class="h">${esc(home)} ${h.home}%</span><span class="d">Draw ${h.draw}%</span><span class="a">${esc(away)} ${h.away}%</span></div>
    <div class="grid" style="margin-top:8px">
      <div class="stat"><small>Over 0.5 goals</small><b>${h.over05}%</b></div>
      <div class="stat"><small>Over 1.5 goals</small><b>${h.over15}%</b></div>
    </div>`;
}

function cornersBlock(c) {
  if (!c) return "";
  const rows = Object.entries(c.over).map(([line, over]) => {
    const under = Math.round((100 - over) * 10) / 10;
    return `<tr><td>${line}</td><td class="${over >= 60 ? "hi" : ""}">${over}%</td><td class="${under >= 60 ? "hi" : ""}">${under}%</td></tr>`;
  }).join("");
  return `<div class="sub">Corners · expected ${c.total} (${c.exp[0]} – ${c.exp[1]})</div>
    <div class="stat" style="padding:4px 10px"><table class="ctable">
      <tr><th style="text-align:left">Line</th><th>Over</th><th>Under</th></tr>${rows}</table></div>`;
}

function card(m) {
  const d = new Date(m.date), f = m.ft, H = m.home.name, A = m.away.name, bh = m.busierHalf;
  const busier = bh.second >= bh.first && bh.second >= bh.equal ? `2nd half (${bh.second}%)`
    : bh.first >= bh.equal ? `1st half (${bh.first}%)` : `Equal (${bh.equal}%)`;
  const h2h = (m.h2h || []).length
    ? m.h2h.map(g => `<div class="h2h"><span>${esc(g.date.slice(0, 7))}</span><span>${esc(g.home)} v ${esc(g.away)}</span><b>${g.score[0]}-${g.score[1]}</b></div>`).join("")
    : `<div class="note">No meetings in the last few seasons.</div>`;
  return `<div class="card" data-id="${m.id}" id="m${m.id}">
    <div class="meta"><span>${esc(LEAGUES[m.league] || m.league)}${m.matchday ? " · MD " + m.matchday : ""}</span>
      <span>${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span></div>
    <div class="teams">
      <div class="team"><div class="nm">${crest(m.home.crest)}<span>${esc(H)}</span></div>${formChips(m.home.form)}</div>
      <div class="xg"><small>Predicted</small><b>${f.score[0]} – ${f.score[1]}</b>xG ${f.xg[0].toFixed(1)} – ${f.xg[1].toFixed(1)}</div>
      <div class="team r"><div class="nm">${crest(m.away.crest)}<span>${esc(A)}</span></div>${formChips(m.away.form)}</div>
    </div>
    ${bar(f.home, f.draw, f.away)}
    <div class="probs"><span class="h">Home ${f.home}%</span><span class="d">Draw ${f.draw}%</span><span class="a">Away ${f.away}%</span></div>
    <div class="pick"><span class="badge">Pick: ${esc(pickText(f.pick, H, A))} <em>${f.pickPct}%</em></span>
      <span class="conf ${f.confidence}">${f.confidence}</span></div>
    <div class="more">
      <div class="sub" style="margin-top:0">Double chance</div>
      <div class="grid three">
        <div class="stat"><small>Home or draw</small><b>${f.dc["1X"]}%</b></div>
        <div class="stat"><small>Away or draw</small><b>${f.dc["X2"]}%</b></div>
        <div class="stat"><small>No draw</small><b>${f.dc["12"]}%</b></div>
      </div>
      <div class="sub">Goals</div>
      <div class="grid">
        <div class="stat"><small>Likely score</small><b>${f.score[0]}-${f.score[1]}</b></div>
        <div class="stat"><small>Both teams score</small><b>${f.btts}%</b></div>
        <div class="stat"><small>Over 1.5 goals</small><b>${f.over15}%</b></div>
        <div class="stat"><small>Over 2.5 goals</small><b>${f.over25}%</b></div>
        <div class="stat"><small>Over 3.5 goals</small><b>${f.over35}%</b></div>
        <div class="stat"><small>More goals in</small><b>${busier}</b></div>
      </div>
      ${halfBlock("First half", m.h1, H, A)}
      ${halfBlock("Second half", m.h2, H, A)}
      ${cornersBlock(m.corners)}
      <div class="sub">Head to head</div>
      ${h2h}
    </div>
    <div class="hint">Tap for double chance, goals, halves, corners & head to head</div>
  </div>`;
}

function renderUpcoming() {
  const list = data.matches.filter(m => inLeague(m.league));
  if (!list.length) return `<div class="empty">No upcoming matches in the next two weeks yet. Check back after the next update.</div>`;
  const byId = Object.fromEntries(data.matches.map(m => [m.id, m]));
  let best = league === "ALL" ? data.best.map(id => byId[id]).filter(Boolean)
    : [...list].filter(m => (new Date(m.date) - Date.now()) < 7 * 86400000)
        .sort((a, b) => b.ft.pickPct - a.ft.pickPct).slice(0, 6);
  let html = "";
  if (best.length) {
    html += `<div class="best"><h3>★ Best picks this week</h3>` + best.map(m =>
      `<div class="bp" data-go="${m.id}"><div class="t"><div>${esc(m.home.name)} v ${esc(m.away.name)}</div>
        <div>${esc(pickText(m.ft.pick, m.home.name, m.away.name))} · ${esc(LEAGUES[m.league])}</div></div>
        <b>${m.ft.pickPct}%</b></div>`).join("") + `</div>`;
  }
  let lastDay = "";
  for (const m of list) {
    const day = dayLabel(new Date(m.date));
    if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    html += card(m);
  }
  return html;
}

// ---------------------------------------------------------------- parlay
// Short parlay: per game, the favourite to win when it's strong (65%+),
// otherwise favourite or draw. Big parlay: straight wins only, for a bigger payout.
function favourite(m) {
  const f = m.ft, home = f.home >= f.away;
  return { name: home ? m.home.name : m.away.name, win: home ? f.home : f.away, dc: home ? f.dc["1X"] : f.dc["X2"] };
}
function safeLeg(m) {
  const fav = favourite(m);
  return fav.win >= 65 ? { m, label: `${fav.name} to win`, p: fav.win }
                       : { m, label: `${fav.name} or draw`, p: fav.dc };
}
function winLeg(m) {
  const fav = favourite(m);
  return { m, label: `${fav.name} to win`, p: fav.win };
}

function parlayCard(title, note, legs, big) {
  if (!legs.length) return "";
  const chance = legs.reduce((x, l) => x * l.p / 100, 1);
  const fair = 1 / chance;
  return `<div class="card parlay${big ? " big" : ""}">
    <div class="head"><div><h3>${title}</h3><div class="note" style="margin:2px 0 0">${note}</div></div>
      <div class="chance"><b>${(chance * 100).toFixed(chance < 0.1 ? 1 : 0)}%</b><small>chance all win</small></div></div>
    ${big ? `<div class="sizes">${[5, 6, 7].map(n => `<button data-size="${n}" class="${n === bigSize ? "on" : ""}">${n} picks</button>`).join("")}</div>` : ""}
    ${legs.map(l => `<div class="leg" data-go="${l.m.id}"><div class="t"><div>${esc(l.label)}</div>
      <div>${esc(l.m.home.name)} v ${esc(l.m.away.name)} · ${esc(new Date(l.m.date).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }))}</div></div>
      <b>${l.p}%</b></div>`).join("")}
    <div class="odds"><span>Fair odds</span><b>${fair.toFixed(2)}</b></div>
    <div class="note" style="margin:6px 0 0">Only worth betting if a bookmaker pays more than ${fair.toFixed(2)} for this parlay.</div>
  </div>`;
}

function renderParlay() {
  const soon = data.matches.filter(m => inLeague(m.league) && new Date(m.date) > Date.now()
    && new Date(m.date) - Date.now() < 15 * 86400000);
  if (soon.length < 3) return `<div class="empty">Not enough upcoming games in the next 2 weeks to build a parlay yet.</div>`;
  const safe = soon.map(safeLeg).sort((a, b) => b.p - a.p).slice(0, 3);
  const wins = soon.map(winLeg).sort((a, b) => b.p - a.p).slice(0, Math.min(bigSize, soon.length));
  return parlayCard("Short parlay", "3 safest picks: the easier one to win", safe, false)
    + parlayCard("Big parlay", "Straight wins only: bigger payout, harder to win", wins, true)
    + `<div class="note">Picks come from games in the next 2 weeks, one pick per game. Picks are combined as separate games, so the chance all win is each chance multiplied together. For entertainment only. If you bet, bet responsibly and only if you are of legal age.</div>`;
}

function renderTables() {
  const codes = Object.keys(LEAGUES).filter(c => inLeague(c) && (data.tables || {})[c]);
  if (!codes.length) return `<div class="empty">Tables will appear after the next update.</div>`;
  return codes.map(c => `<div class="card tbl"><h3>${esc(LEAGUES[c])}</h3><table>
    <tr><th>#</th><th class="tm">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
    ${data.tables[c].map(r => `<tr><td>${r.pos}</td>
      <td class="tm"><div class="row">${crest(r.crest)}<span>${esc(r.name)}</span></div>${formChips(r.form)}</td>
      <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gd > 0 ? "+" : ""}${r.gd}</td><td class="pts">${r.pts}</td></tr>`).join("")}
  </table></div>`).join("");
}

function outcome(h, a) { return h > a ? "1" : h < a ? "2" : "X"; }
function hits(pick, actual) { return pick.includes(actual) && (pick.length === 2 || pick === actual); }

function grade(r) {
  const [hg, ag] = r.result.ft, actual = outcome(hg, ag);
  const dcPick = r.dcPick || (r.probs[0] >= r.probs[2] ? "1X" : "X2");
  const out = {
    main: hits(r.pick, actual),
    dc: hits(dcPick, actual),
    over25: (r.over25 > 50) === (hg + ag > 2.5),
    btts: (r.btts > 50) === (hg > 0 && ag > 0),
    exact: r.score[0] === hg && r.score[1] === ag,
  };
  const ht = r.result.ht;
  if (ht && ht[0] != null) {
    out.h1 = r.h1pick === outcome(ht[0], ht[1]);
    if (r.h2pick) out.h2 = r.h2pick === outcome(hg - ht[0], ag - ht[1]);
  }
  if (r.cornersOver95 != null && r.result.corners != null)
    out.corners = (r.cornersOver95 > 50) === (r.result.corners > 9.5);
  return out;
}

function summaryBlock(rows) {
  const g = rows.map(r => ({ r, g: grade(r) }));
  const rate = (xs, k) => {
    xs = xs.filter(x => x.g[k] !== undefined);
    const n = xs.filter(x => x.g[k]).length;
    return xs.length ? `${Math.round(100 * n / xs.length)}% <small>(${n}/${xs.length})</small>` : "–";
  };
  const hi = g.filter(x => x.r.confidence === "High");
  return { g, html: `<div class="summary">
    <div class="stat"><small>Main pick</small><b>${rate(g, "main")}</b></div>
    <div class="stat"><small>High confidence</small><b>${rate(hi, "main")}</b></div>
    <div class="stat"><small>Favourite or draw</small><b>${rate(g, "dc")}</b></div>
    <div class="stat"><small>Over/Under 2.5</small><b>${rate(g, "over25")}</b></div>
    <div class="stat"><small>Both teams score</small><b>${rate(g, "btts")}</b></div>
    <div class="stat"><small>1st half result</small><b>${rate(g, "h1")}</b></div>
    <div class="stat"><small>2nd half result</small><b>${rate(g, "h2")}</b></div>
    <div class="stat"><small>Corners O/U 9.5</small><b>${rate(g, "corners")}</b></div>
  </div>` };
}

function renderResults() {
  const mark = (ok, label) => ok === undefined ? "" : `<span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"} ${label}</span>`;
  const live = Object.values(history.matches).filter(r => r.result && inLeague(r.league))
    .sort((a, b) => b.date.localeCompare(a.date));
  let html = `<div class="day">Live picks</div>`;
  if (!live.length) {
    html += `<div class="note">No graded live picks yet. Each prediction is locked in before kick-off and checked against the real score after the match.</div>`;
  } else {
    const s = summaryBlock(live);
    html += s.html;
  }

  const bt = (backtest.rows || []).filter(r => r.result && inLeague(r.league));
  html += `<div class="day">Tested on this season's games</div>`;
  if (!bt.length) {
    html += `<div class="note">The back-test will appear after the next update.</div>`;
  } else {
    html += `<div class="note">Every game played so far this season, predicted using only results from before it.</div>`;
    const s = summaryBlock(bt);
    html += s.html;
    if (league === "ALL") {
      html += `<div class="card" style="margin-top:8px">` + Object.keys(LEAGUES).map(c => {
        const xs = s.g.filter(x => x.r.league === c);
        if (!xs.length) return "";
        const n = xs.filter(x => x.g.main).length;
        return `<div class="lg" data-l="${c}"><span>${esc(LEAGUES[c])} ›</span><span>${Math.round(100 * n / xs.length)}% main pick · ${xs.length} games</span></div>`;
      }).join("") + `</div>`;
    }
  }

  const row = r => {
    const x = grade(r);
    return `<div class="card res"><div class="t">
        <div>${esc(r.home)} v ${esc(r.away)}</div>
        <div class="meta"><span>${esc(LEAGUES[r.league])} · ${esc(new Date(r.date).toLocaleDateString(undefined, { day: "numeric", month: "short" }))} · predicted ${r.score[0]}-${r.score[1]}, ${esc(pickText(r.pick, r.home, r.away))}</span></div>
        <div class="marks">${mark(x.main, "Pick")}${mark(x.over25, "O/U 2.5")}${mark(x.btts, "BTTS")}${mark(x.h1, "1st half")}${mark(x.h2, "2nd half")}${mark(x.corners, "Corners")}${x.exact ? mark(true, "Exact score") : ""}</div>
      </div><div class="sc">${r.result.ft[0]}-${r.result.ft[1]}${r.result.corners != null ? `<div class="note" style="margin:0;text-align:right">${r.result.corners} corners</div>` : ""}</div></div>`;
  };
  if (live.length) {
    html += `<div class="day">Recent live picks</div>` + live.slice(0, 60).map(row).join("");
  }
  if (bt.length) {
    html += `<div class="day">Past games (back-test)</div>` +
      [...bt].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 80).map(row).join("");
  }
  return html;
}

function render() {
  renderChips();
  document.getElementById("view").innerHTML =
    tab === "up" ? renderUpcoming() : tab === "parlay" ? renderParlay()
      : tab === "tables" ? renderTables() : renderResults();
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
}

document.querySelector(".tabs").onclick = e => {
  const b = e.target.closest("button"); if (b) { tab = b.dataset.tab; render(); }
};
document.getElementById("chips").onclick = e => {
  const b = e.target.closest("button"); if (b) { league = b.dataset.l; render(); }
};
document.getElementById("view").onclick = e => {
  const lg = e.target.closest(".lg[data-l]");
  if (lg) { league = lg.dataset.l; render(); return; }
  const size = e.target.closest("[data-size]");
  if (size) { bigSize = +size.dataset.size; render(); return; }
  const go = e.target.closest("[data-go]");
  if (go) {
    if (tab !== "up") { tab = "up"; render(); }
    const c = document.getElementById("m" + go.dataset.go);
    if (c) {
      c.classList.add("open", "flash");
      c.scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(() => c.classList.remove("flash"), 1500);
    }
    return;
  }
  const c = e.target.closest(".card[data-id]"); if (c) c.classList.toggle("open");
};

async function load() {
  const bust = "?t=" + Date.now();
  const get = f => fetch(f + bust).then(r => r.ok ? r.json() : null).catch(() => null);
  const [p, h, b] = await Promise.all([get("data/predictions.json"), get("data/history.json"), get("data/backtest.json")]);
  if (p) data = Object.assign(data, p);
  if (h) history = h;
  if (b) backtest = b;
  document.getElementById("updated").textContent = p
    ? `Updated ${ago(p.updated)}` : "No predictions yet. Run the update first.";
  render();
}
load();

// ---------------------------------------------------------------- installable app
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
let installPrompt = null;
const installBtn = document.getElementById("install");
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installPrompt = e;
  if (!standalone) installBtn.classList.add("show");
});
installBtn.onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice.catch(() => null);
  installPrompt = null; installBtn.classList.remove("show");
};
window.addEventListener("appinstalled", () => installBtn.classList.remove("show"));
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) {
  let seen = false;
  try { seen = localStorage.getItem("iosTip") === "1"; localStorage.setItem("iosTip", "1"); } catch (e) {}
  if (!seen) document.getElementById("ios").classList.add("show");
}
window.addEventListener("offline", () => { document.getElementById("updated").textContent += " · offline"; });
</script>
